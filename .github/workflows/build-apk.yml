name: Build Flishly APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Run unit tests
        run: gradle testDebugUnitTest --no-daemon --continue

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Flishly-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Delete old release
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const rel = await github.rest.repos.getLatestRelease({
              owner: context.repo.owner,
              repo: context.repo.repo
            }).catch(() => null);
            if (rel && rel.data && rel.data.tag_name === 'latest') {
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: rel.data.id
              });
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: 'tags/latest'
              });
            }

      - name: Attach APK to latest release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Flishly (latest build)
          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: true

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Flishly-test-results
          path: app/build/test-results/**/*.xml
          if-no-files-found: ignore
